<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
	<!-- the entire body must be written by student -->
	 <div class="container mt-5 p-1 fs-4 border border-dark">
        <h1 class="text-center mt-5">Internship Form</h1>
        <form class="m-5 needs-validation" novalidate>
            <div class="row">
                <div class="col">
                    <label for="first-name-input">First Name</label>
                    <input id="first-name-input" type="text" class="form-control" placeholder=""
                        aria-label="First name" required>
                    <div class="invalid-feedback">
                        First name required!
                    </div>
                </div>
                <div class="col">
                    <label for="last-name-input">Last Name</label>
                    <input id="last-name-input" type="text" class="form-control" placeholder=""
                        aria-label="Last name" required>
                    <div class="invalid-feedback">
                        Last name required!
                    </div>
                </div>
                <div class="col">
                    <label for="email-input">Email Address</label>
                    <input id="email-input" type="text" class="form-control" placeholder="xyz@abc.com"
                        aria-label="Email address" required>
                    <div class="invalid-feedback">
                        Email required!
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-6">
                    <label for="college-input">College</label>
                    <input id="college-input" type="text" class="form-control" placeholder=""
                        aria-label="College name" required>
                    <div class="invalid-feedback">
                        Please provide a valid college.
                    </div>
                </div>
                <div class="col-3">
                    <label for="graduation-year-input" class="input-group-sm">Graduation Year</label>
                    <select class="form-select" id="graduation-year-input" aria-label="Graduation year"
                        required>
                        <option selected disabled value="">Choose...</option>
                        <option value="1">2020</option>
                        <option value="2">2021</option>
                        <option value="3">2022</option>
                        <option value="4">2023</option>
                    </select>
                    <div class="invalid-feedback">
                        Please provide a valid Graduation Year.
                    </div>
                </div>
                <div class="col-3">
                    <label for="roll-no-input">Roll No.</label>
                    <input id="roll-no-input" type="text" class="form-control" placeholder=""
                        aria-label="Roll number" required>
                    <div class="invalid-feedback">
                        Please provide a valid Roll no.
                    </div>
                </div>
            </div>
            <div class="form-check mt-3">
                <input id="conditions-checkbox" class="form-check-input" type="checkbox" value=""
                    id="flexCheckDefault" required>
                <label class="form-check-label" for="conditions-checkbox">
                    Agree to terms & conditions
                </label>
                <div class="invalid-feedback">
                    You must agree before submitting
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Submit Form</button>
        </form>
    </div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
